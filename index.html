    <!-- THESIS: 工作地点开始移动后，年轻人与地方产生了哪些可观察关系；拒绝把有限样本排成全国画像。 OWN-WORLD: 昼光冷灰纸、深蓝黑字、雾蓝刻度、田野绿现场与朱砂重点组成研究台账，路线只表达阅读顺序。 STORY: 读者先看 827→798→282 / 516 样本链，再看工作条件、77 家聚合结构、安吉与黟县案例、政策证据，最后理解“入住不是留下”。 FIRST VIEWPORT: 标题与核心问题占左侧，827→798→282 样本链沿一条资料室刻度横向展开，右侧是“观察窗口而非全国画像”边界，底部有明确的开始阅读入口。 FORM: 定向图例 / 路线图语法，候选 5，seed 3f65ff6e；已将地图限制为阅读秩序，不绘制虚假地点。 FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md -->
    <div id="root"></div>
    <noscript>
      <main style="min-height:100vh;background:#F3F4F1;color:#172A3A;padding:4rem 1.5rem;font-family:system-ui,sans-serif">
        <div style="max-width:48rem;margin:0 auto">

          <h1 style="margin:1rem 0;font-family:Georgia,serif;font-size:clamp(2.25rem,8vw,5rem)">数字江河</h1>
          <p style="line-height:1.9">当工作离开固定办公室，年轻人与地方正在发生什么？本文把有限样本、研究样本、真实报道和政策目标分开呈现，不把它们拼成全国人口结论。</p>
          <p style="margin-top:1.5rem;line-height:1.9">核心材料包括 NCC 社区渠道问卷的 827 份回收、798 份有效问卷、282 名数字游民样本、516 名探索者和 8 名访谈对象；以及截至 2025 年底研究纳入的 77 家正常运营社区。安吉与黟县为地点案例，不代表全国规模或长期效果。</p>
          <p style="margin-top:1.5rem;color:#667D58;font-family:monospace">核心判断：入住不是留下；到访不是就业；项目也不是长期结果。</p>
